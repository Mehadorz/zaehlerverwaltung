
version: '3.8'

services:
  app:
    build: 
      context: https://github.com/yourusername/your-repo.git#main  # Hier musst du deine Repository-URL einfügen
      dockerfile: Dockerfile
    ports:
      - "8080:3000"  # Änderung auf Port 3000, da Vite standardmäßig diesen Port verwendet
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=meter_user
      - DB_PASSWORD=meter_password
      - DB_NAME=meter_db
      - DB_PORT=3306
      - VITE_API_URL=http://localhost:8080  # Hinzufügung der API-URL
    networks:
      - meter-network
    restart: unless-stopped

  db:
    image: mariadb:latest
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=meter_db
      - MYSQL_USER=meter_user
      - MYSQL_PASSWORD=meter_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - meter-network
    restart: unless-stopped

networks:
  meter-network:
    driver: bridge

volumes:
  db_data:
    driver: local
