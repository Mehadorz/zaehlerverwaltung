
version: '3.8'

services:
  app:
    build: 
      context: https://github.com/yourusername/your-repo.git#main  # Hier musst du deine Repository-URL einfügen
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=meter_user
      - DB_PASSWORD=meter_password
      - DB_NAME=meter_db
      - DB_PORT=3306
    restart: unless-stopped

  db:
    image: mariadb:latest
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=meter_db
      - MYSQL_USER=meter_user
      - MYSQL_PASSWORD=meter_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  db_data:
    driver: local

